# Runs on every push. No secrets, no cost, no buttons to press.
#
# This is the one that has to stay green. It type-checks the gateway and runs
# the whole test suite — the scope guard's refusal boundary, the verifier's
# arithmetic, the evidence-packet extraction, and the eval dispatcher against
# the real frozen cases. None of it calls a model or touches the database, so
# it is free and gives the same answer every time.

name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gateway:
    name: Gateway types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/supabase/functions/ai-gateway
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: deno check index.ts eval.ts ingest.ts ingest_usda.ts

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test

  billing:
    name: Billing types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/supabase/functions/billing
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: deno check index.ts hmac.ts pricing.ts webhook.ts

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test

  # The app itself. 11,681 lines of Dart and the whole billing, quota and
  # onboarding test surface never ran on push before this job existed — a
  # file that did not compile reached main (d965702) and nothing said so.
  # Pinned to the version README.md was verified against.
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Infos (deprecations the SDK introduces between releases) do not fail
      # the build; errors and warnings do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
