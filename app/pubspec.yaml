name: qamar
description: Qamar — AI Health OS. Personal nutritionist in your pocket.
publish_to: "none"
version: 0.9.0+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — one app-wide store mirrors the prototype's single
  # Component class; Provider keeps that mapping literal and avoids codegen.
  provider: ^6.1.2

  # Backend integration surface. Disabled by default (see lib/services/config.dart);
  # the app runs fully on local in-memory state until real keys are supplied.
  supabase_flutter: ^2.5.11

  # Native camera capture for the InBody scan screen.
  image_picker: ^1.1.2

  # Real dictation, using the platform's own recogniser (Android SpeechRecognizer
  # / iOS Speech). No API key and no audio leaves the device except through the
  # OS service the user already trusts.
  speech_to_text: ^7.0.0

  # Opening the legal pages on dr-qamar.com. Already present transitively via
  # supabase_flutter; declared here because we call it directly.
  url_launcher: ^6.3.2

  intl: ^0.20.3
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/qamar_orb.png
    - assets/images/qamar_orb_sm.png
    - assets/images/su_coin.png

  # Bundled rather than fetched at runtime. google_fonts downloads on first
  # launch, so a phone with no connection — or one in Egypt on a bad line —
  # rendered the whole Arabic UI as tofu boxes until the download landed.
  # Only the weights the app actually asks for are shipped.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-300.ttf
          weight: 300
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
